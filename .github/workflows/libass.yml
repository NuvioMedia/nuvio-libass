name: libass Android package

on:
  workflow_dispatch:
  push:
    tags:
      - 'libass-*'

permissions:
  contents: write

jobs:
  build:
    name: Build libass for Android
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm gperf zip
          python3 -m pip install --user --break-system-packages 'meson>=1.11'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build package
        id: build
        run: |
          set -o pipefail
          ./scripts/libass/build-android.sh 2>&1 | tee build.log
          grep -E '^(version|zip)=' build.log >> "$GITHUB_OUTPUT"
          zip="$(grep -E '^zip=' build.log | cut -d= -f2-)"
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### libass Android package"
            echo
            echo "- Version: \`$(grep -E '^version=' build.log | cut -d= -f2-)\`"
            echo "- SHA-256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libass-android-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/libass-')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if [ "$GITHUB_REF_NAME" != "libass-$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match libass-$VERSION" >&2
            exit 1
          fi
          notes="libass $VERSION for Android (arm64-v8a, armeabi-v7a, x86, x86_64), built from the libass submodule. SHA-256: $SHA256"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "libass $VERSION" --notes "$notes"
          fi
